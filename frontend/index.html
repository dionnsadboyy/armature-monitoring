<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Armature Monitoring</title>
</head>
<body>
  <main role="status" aria-live="polite">Memeriksa sesi...</main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/auth.js"></script>
  <script>
    (() => {
      const roleRoutes = {
        bop: "./GEDUNG1/index.html",
        viewer: "./GEDUNG2/index.html",
      };
      const loginRoute = "./LOGIN/index.html";

      async function routeFromRoot() {
        try {
          const authenticated = await window.authService.getAuthenticatedProfile();
          const destination = authenticated && roleRoutes[authenticated.profile.role];

          window.location.replace(destination || loginRoute);
        } catch (error) {
          console.error("Root session gateway error:", error);
          await window.supabaseClient.auth.signOut();
          window.location.replace(loginRoute);
        }
      }

      routeFromRoot();
    })();
  </script>
</body>
</html>
